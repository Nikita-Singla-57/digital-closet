<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Digital Closet</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            👗 Digital Closet
        </div>

        <a href="login.html">Already have an account? Log in</a>
    </header>

    <main class="auth-page">

        <section class="auth-card">

            <p class="subtitle">YOUR PERSONAL STYLE SPACE</p>

            <h1>Create your account</h1>

            <p class="auth-description">
                Organize your wardrobe and plan outfits
                in one place.
            </p>

            <form id="signupForm">

                <div class="auth-form-group">
                    <label for="signupName">Full name</label>
                    <input
                        type="text"
                        id="signupName"
                        name="name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="auth-form-group">
                    <label for="signupEmail">Email address</label>
                    <input
                        type="email"
                        id="signupEmail"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="auth-form-group">
                    <label for="signupPassword">Password</label>
                    <input
                        type="password"
                        id="signupPassword"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="auth-form-group">
                    <label for="confirmPassword">
                        Confirm password
                    </label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <p
                    id="signupMessage"
                    class="auth-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="primary-btn auth-submit"
                >
                    Create Account
                </button>

            </form>

            <p class="auth-switch">
                Already registered?
                <a href="login.html">Sign in</a>
            </p>

        </section>

    </main>

    <script src="js/auth.js"></script>

</body>

</html>
